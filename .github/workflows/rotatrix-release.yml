name: Build release packages

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved full source SHA (must match the selected ref)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify selected source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
      - name: Release selection regression tests
        run: python3 -m unittest discover -s tests/release -v
  linux:
    needs: candidate
    uses: ./.github/workflows/linux-tests.yml
  windows:
    needs: candidate
    uses: ./.github/workflows/windows.yml
  macos:
    needs: candidate
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/macos-tests.yml
