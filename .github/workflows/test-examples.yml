name: Linux Examples Tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    name: Test examples - non-experimental
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Install dependencies
      run: |
        which sudo || apt install -y sudo
        sudo ./scripts/uni-get-dependencies.sh qt6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Build and test
      run: ./scripts/github-ci.sh enable_python build test_examples test
    - name: Upload Test Result Report
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: Test Result Report (Test examples non-experimental)-${{ github.sha }}
        retention-days: 10
        path: |
          b/Testing/Temporary/*_report.html
          b/Testing/Temporary/LastTest.log
