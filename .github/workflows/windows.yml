name: Windows(msys2) Experimental Tests

on:
  push:
    branches:
      - 'rotatrix/**'
  pull_request:
    branches: ['rotatrix/*']
  workflow_dispatch:
    inputs:
      qt_variant:
        type: choice
        description: Qt variant for a focused retry
        options: [all, qt5, qt6]
        default: all
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.qt_variant || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        qt: ${{ fromJSON(inputs.qt_variant == 'qt5' && '["qt5"]' || inputs.qt_variant == 'qt6' && '["qt6"]' || '["qt5", "qt6"]') }}
    runs-on: windows-2022
    name: windows-2022 ${{ matrix.qt }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Setup (detached) tmate session if enabled
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          detached: true
      - name: Calculate PACBOY_PACKAGES
        shell: bash
        run: |
          pwd
          ./scripts/msys2-install-dependencies.sh ${{ matrix.qt }}
      - name: Setup MSYS2 Environment
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: libxml2
          pacboy: ${{ env.PACBOY_PACKAGES }}
      - name: Install Mesa
        uses: ssciwr/setup-mesa-dist-win@v3
        with:
          version: '22.1.7'
          build-type: 'release-mingw'
      - name: Build OpenSCAD
        run: |
          mkdir build && cd build
          cmake .. -DENABLE_OPENAXIS=ON -G"Ninja" -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DEXPERIMENTAL=ON -DSNAPSHOT=ON -DUSE_QT6=${{ matrix.qt == 'qt6' && 'ON' || 'OFF' }}
          cmake --build . -j4
          cmake --install . --prefix=.
      - name: Package Windows test build
        run: |
          cmake --install build --prefix "$PWD/package"
          if [ '${{ matrix.qt }}' = qt6 ]; then
            /ucrt64/bin/windeployqt6 --release --compiler-runtime package/openscad.exe
          else
            deployqt=$(pacman -Ql mingw-w64-ucrt-x86_64-qt5-base | awk '/\/windeployqt[^\/]*\.exe$/ {print $2; exit}')
            test -n "$deployqt"
            "$deployqt" --release --compiler-runtime package/openscad.exe
          fi
          ldd build/openscad.exe | awk '/\/ucrt64\// {print $3}' | xargs -r -I{} cp '{}' package/
          test -f package/openscad.exe
      - uses: actions/upload-artifact@v7
        with:
          name: openscad-windows-${{ matrix.qt }}-${{ github.sha }}
          path: package/
          retention-days: 10
          if-no-files-found: error
      - name: Run Test Suite
        run: |
          cd build
          ctest -j4
      - name: Setup (detached) tmate session if enabled
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      - name: Upload Test Result Report
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Test Result Report (Windows ${{ matrix.qt }})-${{ github.sha }}
          retention-days: 10
          path: |
            build/Testing/Temporary/*_report.html
            build/Testing/Temporary/LastTest.log
