name: macOS Experimental Tests

on:
  push:
    branches:
      - 'rotatrix/**'
  pull_request:
    branches: ['rotatrix/*']
  workflow_dispatch:
    inputs:
      package_comparison:
        type: boolean
        description: Compare existing ARM64 packages without rebuilding
        default: false
      architecture:
        type: choice
        description: Architecture for a focused retry
        options: [all, arm64, x86_64]
        default: all
      upstream_baseline:
        type: boolean
        description: Diagnose the exact upstream source with the same runner and dependencies
        default: false
      debug_enabled:
        type: boolean
        description: 'Run the build with ssh debugging enabled'
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.architecture || 'all' }}-${{ inputs.upstream_baseline || false }}
  cancel-in-progress: true

jobs:
  compare_packages:
    if: inputs.package_comparison
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download existing repair and upstream packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36645322980 --repo rotatrix/openscad --name openscad-macos-arm64-qt6-d4bf8a711b4b58040f3bc3ebf9f75d1cbcfb883f --dir packages/repair
          gh run download 36647981385 --repo rotatrix/openscad --name openscad-macos-arm64-qt6-d4bf8a711b4b58040f3bc3ebf9f75d1cbcfb883f-upstream-baseline --dir packages/upstream
          for variant in repair upstream; do
            mkdir -p "packages/$variant/mount"
            hdiutil attach "packages/$variant/OpenSCAD.dmg" -nobrowse -readonly -mountpoint "$PWD/packages/$variant/mount"
            ditto "packages/$variant/mount/OpenSCAD.app" "packages/$variant/OpenSCAD.app"
            hdiutil detach "packages/$variant/mount"
          done
      - name: Compare repeated renders on the same native runner
        run: |
          python3 -m venv comparison-venv
          comparison-venv/bin/pip install pillow numpy
          mkdir -p comparison
          comparison-venv/bin/python tests/openaxis/compare-packages.py 2>&1 | tee comparison/log.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-package-comparison-${{ github.sha }}
          path: comparison/
          retention-days: 10
  build_and_test:
    if: ${{ !inputs.package_comparison }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"os":"macos-15","arch":"arm64","qt":"qt6"}]' || inputs.architecture == 'x86_64' && '[{"os":"macos-15-intel","arch":"x86_64","qt":"qt6"}]' || '[{"os":"macos-15-intel","arch":"x86_64","qt":"qt6"},{"os":"macos-15","arch":"arm64","qt":"qt6"}]') }}
    runs-on:  ${{ matrix.os }}
    name: ${{ matrix.os }} ${{ matrix.arch }} ${{ matrix.qt }}
    # If it's not done in 90 minutes, something is wrong.
    # Default is 6 hours, which is a bit long to wait.
    timeout-minutes: 90
    steps:
    - name: Set Qt version
      run: |
        case ${{ matrix.qt }} in
        qt5) echo "CMAKE_OPTIONS=-DUSE_QT6=0" >> $GITHUB_ENV ;;
        esac
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Restore upstream source for baseline comparison
      if: inputs.upstream_baseline
      run: |
        git fetch origin c2c321215e67b87d1f7f10f46f26bfafee04b215
        git restore --source=c2c321215e67b87d1f7f10f46f26bfafee04b215 -- CMakeLists.txt src
    - name: Setup (detached) tmate ssh session if enabled
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 15
      with:
        detached: true
        limit-access-to-actor: true
    - name: Workaround for https://github.com/actions/runner-images/issues/9966
      run: |
        brew unlink python3
        brew link --overwrite python3
    - name: Install Homebrew packages
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        OPENSCAD_INSTALL_CCACHE: 0
      run: |
        export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
        ./scripts/macosx-build-homebrew.sh ${{ matrix.qt }}
    - name: Build OpenSCAD
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DENABLE_OPENAXIS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_UNITY_BUILD=OFF -DEXPERIMENTAL=ON -DSNAPSHOT=ON -DUSE_CCACHE=OFF -DUSE_BUILTIN_OPENCSG=ON $CMAKE_OPTIONS
        export NUMCPU=$(($(sysctl -n hw.ncpu) * 3 / 2))
        make -j$NUMCPU
    - name: Package macOS test build
      run: |
        "$(brew --prefix qt)/bin/macdeployqt" build/OpenSCAD.app -dmg
    - name: Verify native package
      run: |
        test "$(uname -m)" = '${{ matrix.arch }}'
        app=build/OpenSCAD.app
        while IFS= read -r -d '' binary; do
          if file -b "$binary" | grep -q 'Mach-O'; then
            lipo "$binary" -verify_arch '${{ matrix.arch }}'
          fi
        done < <(find "$app" -type f -print0)
        "$app/Contents/MacOS/OpenSCAD" --version
        printf 'cube([10,20,30]);\n' > build/package-smoke.scad
        "$app/Contents/MacOS/OpenSCAD" -o build/package-smoke.stl build/package-smoke.scad
        test -s build/package-smoke.stl
        hdiutil verify build/OpenSCAD.dmg
    - uses: actions/upload-artifact@v7
      with:
        name: openscad-macos-${{ matrix.arch }}-${{ matrix.qt }}-${{ github.sha }}${{ inputs.upstream_baseline && '-upstream-baseline' || '' }}
        path: build/OpenSCAD.dmg
        retention-days: 10
        if-no-files-found: error
    - name: Run Test Suite
      # Disable pdf export test on macOS because Cairo >= 1.18 on Homebrew uses the
      # Quartz backend which doesn't have the Liberation Sans font we use.
      run: |
        cd build
        export NUMCPU=$(($(sysctl -n hw.ncpu) * 3 / 2))
        if [ '${{ matrix.arch }}' = arm64 ]; then
          # Repeat failing cases to distinguish intermittent software-renderer
          # differences from reproducible failures. No tests are excluded.
          ctest -j$NUMCPU -E pdfexporttest --repeat until-pass:3
        else
          ctest -j$NUMCPU -E pdfexporttest
        fi
    - name: Upload Test Result Report
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: Test Result Report (MacOS ${{ matrix.arch }} ${{ matrix.qt }})-${{ github.sha }}
        retention-days: 10
        path: |
          build/Testing/Temporary/*_report.html
          build/Testing/Temporary/LastTest.log
