name: macOS Experimental Tests

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      architecture:
        type: choice
        description: Architecture for a focused retry
        options: [all, arm64, x86_64]
        default: all
      debug_enabled:
        type: boolean
        description: 'Run the build with ssh debugging enabled'
        required: false
        default: false

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}-${{ inputs.architecture || 'all' }}
  cancel-in-progress: false

jobs:
  build_and_test:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"os":"macos-15","arch":"arm64"}]' || inputs.architecture == 'x86_64' && '[{"os":"macos-15-intel","arch":"x86_64"}]' || '[{"os":"macos-15-intel","arch":"x86_64"},{"os":"macos-15","arch":"arm64"}]') }}
    runs-on:  ${{ matrix.os }}
    name: ${{ matrix.os }} ${{ matrix.arch }} qt6
    # If it's not done in 90 minutes, something is wrong.
    # Default is 6 hours, which is a bit long to wait.
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Setup (detached) tmate ssh session if enabled
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 15
      with:
        detached: true
        limit-access-to-actor: true
    - name: Workaround for https://github.com/actions/runner-images/issues/9966
      run: |
        brew unlink python3
        brew link --overwrite python3
    - name: Install Homebrew packages
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        OPENSCAD_INSTALL_CCACHE: 0
      run: |
        export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
        ./scripts/macosx-build-homebrew.sh qt6
    - name: Build OpenSCAD
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DENABLE_OPENAXIS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_UNITY_BUILD=OFF -DEXPERIMENTAL=ON -DSNAPSHOT=ON -DUSE_CCACHE=OFF -DUSE_BUILTIN_OPENCSG=ON
        export NUMCPU=$(($(sysctl -n hw.ncpu) * 3 / 2))
        make -j$NUMCPU
    - name: Bundle and archive macOS app
      env:
        PACKAGE_VARIANT: ${{ matrix.arch }}-qt6-${{ github.sha }}
      run: |
        cmake -DAPP_BUNDLE="$PWD/build/OpenSCAD.app" -P scripts/macos-translation-catalogs.cmake
        python3 scripts/macos-dependency-notices.py build/OpenSCAD.app
        "$(brew --prefix qt)/bin/macdeployqt" build/OpenSCAD.app -codesign=-
        mkdir -p artifacts package-check
        COPYFILE_DISABLE=1 tar -czf "artifacts/macos-app-$PACKAGE_VARIANT.tar.gz" -C build OpenSCAD.app
        tar -xzf "artifacts/macos-app-$PACKAGE_VARIANT.tar.gz" -C package-check
    - name: Verify native package
      run: |
        test "$(uname -m)" = '${{ matrix.arch }}'
        app=package-check/OpenSCAD.app
        cmake -DAPP_BUNDLE="$PWD/$app" -DVERIFY_ONLY=ON -P scripts/macos-translation-catalogs.cmake
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = org.openscad.OpenSCAD
        codesign --verify --deep --strict "$app"
        while IFS= read -r -d '' binary; do
          if file -b "$binary" | grep -q 'Mach-O'; then
            lipo "$binary" -verify_arch '${{ matrix.arch }}'
          fi
        done < <(find "$app" -type f -print0)
        "$app/Contents/MacOS/OpenSCAD" --version
        printf 'cube([10,20,30]);\n' > build/package-smoke.scad
        "$app/Contents/MacOS/OpenSCAD" -o build/package-smoke.stl build/package-smoke.scad
        test -s build/package-smoke.stl
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        path: artifacts/macos-app-*.tar.gz
        archive: false
        retention-days: 10
        if-no-files-found: error
    - name: Attest release app
      if: github.repository == 'rotatrix/openscad' && startsWith(github.ref, 'refs/heads/rotatrix/')
      uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
      with:
        subject-path: artifacts/macos-app-*.tar.gz
    - name: Run Test Suite
      # Disable pdf export test on macOS because Cairo >= 1.18 on Homebrew uses the
      # Quartz backend which doesn't have the Liberation Sans font we use.
      run: |
        cd build
        export NUMCPU=$(($(sysctl -n hw.ncpu) * 3 / 2))
        if [ '${{ matrix.arch }}' = arm64 ]; then
          # Repeat failing cases to distinguish intermittent software-renderer
          # differences from reproducible failures. No tests are excluded.
          result=0
          ctest -j$NUMCPU -E pdfexporttest --repeat until-pass:3 --output-on-failure --output-junit arm64-tests.xml || result=$?
          python3 ../scripts/check-arm64-tests.py arm64-tests.xml "$result"
        else
          ctest -j$NUMCPU -E pdfexporttest --output-on-failure
        fi
    - name: Upload Test Result Report
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: Test Result Report (MacOS ${{ matrix.arch }} qt6)-${{ github.sha }}
        retention-days: 10
        path: |
          build/Testing/Temporary/*_report.html
          build/Testing/Temporary/LastTest.log
          build/arm64-tests.xml
