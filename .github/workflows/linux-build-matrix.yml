name: Linux Release Build

on:
  push:
    branches:
      - 'rotatrix/**'
  pull_request:
    branches: ['rotatrix/*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04 ]
        headless: [ ON, OFF ]
        enable_tests: [ ON, OFF ]
        enable_manifold: [ ON, OFF ]

    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }}:HEADLESS=${{ matrix.headless }},ENABLE_TESTS=${{ matrix.enable_tests }},ENABLE_MANIFOLD=${{ matrix.enable_manifold }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Install dependencies
      run: |
        which sudo || apt install -y sudo
        sudo ./scripts/uni-get-dependencies.sh qt6
    - name: Run CMake
      run: >
        cmake -S . -B build -GNinja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_OPENAXIS=${{ matrix.headless == 'OFF' && 'ON' || 'OFF' }} \
          -DHEADLESS=${{ matrix.headless }} \
          -DENABLE_MANIFOLD=${{ matrix.enable_manifold }} \
          -DENABLE_TESTS=${{ matrix.enable_tests }}
    - name: Build OpenSCAD
      run: cmake --build build
