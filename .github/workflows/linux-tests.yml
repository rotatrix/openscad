name: Linux Experimental Tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: linux-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
        qt: [ qt5, qt6 ]
        exclude:
          - os: ubuntu-22.04
            # libqscintilla2-qt6-dev not packaged
            qt: qt6

    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} ${{ matrix.qt }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: Etc/UTC
      run: |
        which sudo || apt install -y sudo
        sudo ./scripts/uni-get-dependencies.sh ${{ matrix.qt }}
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.13'
    - name: Install SDK-compatible CMake on Ubuntu 22.04
      if: matrix.os == 'ubuntu-22.04'
      run: |
        uv tool install cmake==3.31.6
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Install gcovr
      run: uv sync --project .github/ci/openscad-coverage
    - name: Build
      run: ./scripts/github-ci.sh experimental enable_python ${{ matrix.qt }} build
    - name: Test
      # This is a bit wonky to use github-ci as it is.
      # `test` runs ctest, `test_examples` sets a persistent flag for ctest to run a different "configuration".
      # So we're running the default tests (no specified configuration), then the example tests. Has to be in that order.
      # Finally coverage reports what code paths got executed.
      run: ./scripts/github-ci.sh test test_examples test coverage
    - name: Upload Test Result Report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: ${{ always() }}
      with:
        name: Test Result Report (${{ matrix.os }} ${{ matrix.qt }})-${{ github.sha }}
        retention-days: 10
        path: |
          b/Testing/Temporary/*_report.html
          b/Testing/Temporary/LastTest.log
    - name: Upload Code Coverage Report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: Code Coverage Report (${{ matrix.os }} ${{ matrix.qt }})-${{ github.sha }}
        retention-days: 10
        path: c/coverage*.html

  appimage:
    name: AppImage x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: docker/setup-buildx-action@v3
    - name: Build upstream AppImage environment
      uses: docker/build-push-action@v6
      with:
        context: .
        file: scripts/docker/appimage-base/Dockerfile
        target: appimage-base
        tags: openscad-appimage-base:local
        load: true
        cache-from: type=gha,scope=openscad-appimage-base
        cache-to: type=gha,scope=openscad-appimage-base,mode=max
    - name: Install isolated CMake
      run: |
        mkdir -p "$RUNNER_TEMP/openscad-tools"
        cd "$RUNNER_TEMP/openscad-tools"
        base=https://github.com/Kitware/CMake/releases/download/v3.31.6
        curl --fail --location --retry 3 -O "$base/cmake-3.31.6-linux-x86_64.tar.gz"
        curl --fail --location --retry 3 -O "$base/cmake-3.31.6-SHA-256.txt"
        grep ' cmake-3.31.6-linux-x86_64.tar.gz$' cmake-3.31.6-SHA-256.txt | sha256sum --check --strict
        tar -xzf cmake-3.31.6-linux-x86_64.tar.gz
    - uses: actions/cache@v4
      with:
        path: |
          build-appimage/compile
          build-appimage/python
        key: appimage-x64-${{ hashFiles('scripts/docker/appimage-base/Dockerfile', 'scripts/uni-get-dependencies.sh', 'scripts/linux-appimage.sh') }}-${{ github.sha }}
        restore-keys: |
          appimage-x64-${{ hashFiles('scripts/docker/appimage-base/Dockerfile', 'scripts/uni-get-dependencies.sh', 'scripts/linux-appimage.sh') }}-
    - name: Build and verify AppImage
      run: |
        docker run --rm \
          -e OPENSCAD_COMMIT="$GITHUB_SHA" \
          -e CMAKE=/tools/cmake/bin/cmake -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
          -v "$PWD:/openscad" \
          -v "$RUNNER_TEMP/openscad-tools/cmake-3.31.6-linux-x86_64:/tools/cmake:ro" \
          -w /openscad openscad-appimage-base:local bash scripts/linux-appimage.sh all
    - name: Make build cache accessible
      if: always()
      run: |
        if [ -d build-appimage ]; then sudo chown -R "$(id -u):$(id -g)" build-appimage; fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        path: artifacts/appimage/*.AppImage
        archive: false
        retention-days: 10
        if-no-files-found: error
