name: macos

on:
  push:
    branches:
      - 'rotatrix/**'
  pull_request:
    branches: ['rotatrix/*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Checkout MCAD
      run: |
        git submodule update --init --recursive
    - name: Setup Homebrew
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        ENV_SPECIFIC_DISABLE: "|edges_view-options-tests"
      run: |
        ./scripts/macosx-build-homebrew.sh
    - name: Build OpenSCAD
      run: |
        cmake -S cmake/openaxis-qmake -B openaxis-build -DCMAKE_BUILD_TYPE=Release
        cmake --build openaxis-build --parallel 2
        qmake openscad.pro CONFIG+=openaxis CONFIG-=debug CONFIG+=experimental CONFIG+=snapshot CONFIG+=info
        make -j2
        cd tests
        cmake .
        make -j2
    - name: Run Test Suite
      run: |
        cd tests
        ctest -j2 -E 'edges_view-options-tests'
    - name: Upload Test Result Report
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: test-macos-${{ github.sha }}
        retention-days: 10
        path: tests/Testing/Temporary/*_report.html
    - name: Package macOS test build
      run: |
        macdeployqt OpenSCAD.app -dmg
    - uses: actions/upload-artifact@v4
      with:
        name: openscad-macos-x86_64-${{ github.sha }}
        retention-days: 10
        if-no-files-found: error
        path: OpenSCAD.dmg
