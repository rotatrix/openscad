name: ARM64 package rendering comparison
on:
  workflow_call:
    inputs:
      repair_run:
        type: string
        required: true
      upstream_run:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      repair_run:
        description: OpenAxis build run ID
        type: string
        required: true
      upstream_run:
        description: Exact upstream-baseline build run ID
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.repair_run }}
          github-token: ${{ github.token }}
          pattern: macos-app-arm64-*.tar.gz
          path: packages/repair
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.upstream_run }}
          github-token: ${{ github.token }}
          pattern: macos-app-arm64-*.tar.gz
          path: packages/upstream
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Extract existing repair and upstream packages
        run: |
          for variant in repair upstream; do
            archives=(packages/"$variant"/*.tar.gz)
            test "${#archives[@]}" -eq 1
            tar -xzf "${archives[0]}" -C "packages/$variant"
          done
      - name: Compare repeated renders on the same native runner
        run: |
          set -o pipefail
          python3 -m venv comparison-venv
          comparison-venv/bin/pip install pillow numpy
          mkdir -p comparison
          comparison-venv/bin/python tests/openaxis/compare-packages.py 2>&1 | tee comparison/log.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-package-comparison-${{ github.sha }}
          path: comparison/
          retention-days: 10
